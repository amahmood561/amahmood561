name: Update README Stats

on:
  schedule:
    - cron: "0 6 * * *"   # runs daily at 6 AM UTC
  workflow_dispatch:      # allows manual trigger

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update stats section
        run: |
          python3 <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text()
          start = "<!--START_SECTION:stats-->"
          end = "<!--END_SECTION:stats-->"
          updated = datetime.now(timezone.utc).strftime("%a %b %d %H:%M:%S UTC %Y")
          stats = f"""{start}

          ## 📊 GitHub Stats

          ![Ali’s GitHub stats](https://github-readme-stats.vercel.app/api?username=amahmood561&show_icons=true&theme=radical)  
          ![Top Languages](https://github-readme-stats.vercel.app/api/top-langs/?username=amahmood561&layout=compact&theme=radical)  

          _Last Updated: {updated}_
          {end}"""

          before, rest = content.split(start, 1)
          _, after = rest.split(end, 1)
          readme.write_text(before + stats + after)
          PY

      - name: Commit changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions"
          git add README.md
          git commit -m "chore: auto-update README stats" || echo "No changes to commit"
          git push
