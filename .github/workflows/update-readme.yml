name: Update README Stats

on:
  schedule:
    - cron: "0 6 * * *"   # runs daily at 6 AM UTC
  workflow_dispatch:      # allows manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Update stats section
        run: |
          stats=$(cat <<'EOF'

## 📊 GitHub Stats

![Ali’s GitHub stats](https://github-readme-stats.vercel.app/api?username=amahmood561&show_icons=true&theme=radical)  
![Top Languages](https://github-readme-stats.vercel.app/api/top-langs/?username=amahmood561&layout=compact&theme=radical)  

_Last Updated: $(date -u)_
EOF
          )

          awk -v stats="$stats" '
            /<!--START_SECTION:stats-->/ {print; print stats; skip=1; next}
            /<!--END_SECTION:stats-->/ {skip=0}
            skip==0 {print}
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions"
          git add README.md
          git commit -m "chore: auto-update README stats" || echo "No changes to commit"
          git push
